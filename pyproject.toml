[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "elevate-voice-agent"
version = "1.0.0"
description = "Production AI outbound voice sales agent for ElevateBox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.4",
    "hiredis>=2.3.2",
    "openai>=1.35.0",
    "dateparser>=1.2.0",
    "pytz>=2024.1",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.134.0",
    "slowapi>=0.1.9",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "cryptography>=42.0.8",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-pytz",
    "types-redis",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
